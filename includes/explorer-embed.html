<style>
  iframe.explorer-frame { display: block; width: 100%; height: 720px; border: 1px solid var(--bs-border-color, #dee2e6); border-radius: 8px; margin: 1.5rem 0 0.25rem; }
  p.explorer-note { font-size: 0.85rem; margin: 0 0 1.5rem; text-align: right; }
</style>
<script>
/* Sizes embedded explorers to their content and keeps their theme in step with the book's light/dark toggle. */
(function () {
  function frames() { return document.querySelectorAll('iframe.explorer-frame'); }
  function isDark() { return document.body.classList.contains('quarto-dark'); }
  function pushTheme(win) { try { win.postMessage({ type: 'explorer-theme', dark: isDark() }, '*'); } catch (e) {} }
  window.addEventListener('message', function (e) {
    if (!e.data || !e.data.type) return;
    frames().forEach(function (f) {
      if (f.contentWindow !== e.source) return;
      if (e.data.type === 'explorer-height') f.style.height = e.data.height + 'px';
      if (e.data.type === 'explorer-ready') pushTheme(f.contentWindow);
    });
  });
  new MutationObserver(function () { frames().forEach(function (f) { pushTheme(f.contentWindow); }); })
    .observe(document.body, { attributes: true, attributeFilter: ['class'] });
})();
</script>
