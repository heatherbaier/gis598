project:
  type: book
  output-dir: _book
  resources:
    - explorers/*.html

book:
  title: "Geospatial Artificial Intelligence with Python"
  author: "Heather Baier"
  date: today
  search: true
  sidebar:
    style: docked
  chapters:
    - index.qmd
    - part: "1 Foundations"
      chapters:
        - chapters/01-gis-and-spatial-analysis.qmd
        - chapters/02-ai-and-machine-learning.qmd
        - chapters/03-what-is-geoai.qmd
    - part: "2 Unsupervised learning"
      chapters:
        - chapters/2.1-k-means.qmd
    - part: "3 Supervised learning"
      chapters:
        - chapters/3.1-supervised-learning-basics.qmd
        - chapters/3.2-decision-trees.qmd
        - chapters/3.3-random-forests.qmd
        - chapters/3.4-spatial-cross-validation.qmd
        - chapters/3.5-explainable-ai.qmd
        - chapters/3.6-neural-networks.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, styles/light.scss, styles/book.scss]
      dark: [darkly, styles/dark.scss, styles/book.scss]
    number-sections: false
    filters:
      - filters/chapter-numbers.lua
    toc: true
    toc-depth: 3
    code-copy: true
    include-after-body: includes/explorer-embed.html
    shortcodes:
      - shortcodes/explorer.lua

execute:
  freeze: auto
